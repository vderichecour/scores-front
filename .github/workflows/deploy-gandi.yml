name: Deploy to Gandi (static SPA)

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-gandi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GANDI_STATIC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY repository variables."
            exit 1
          fi
          npm run build:gandi

      - name: Prepare htdocs for Gandi
        run: bash scripts/prepare-gandi-deploy.sh

      - name: Configure SSH
        env:
          GANDI_SSH_KEY: ${{ secrets.GANDI_SSH_KEY }}
          GANDI_SSH_HOST: ${{ vars.GANDI_SSH_HOST }}
          GANDI_SSH_USER: ${{ vars.GANDI_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$GANDI_SSH_KEY" > ~/.ssh/gandi_deploy
          chmod 600 ~/.ssh/gandi_deploy
          ssh-keygen -y -f ~/.ssh/gandi_deploy > /dev/null
          ssh-keyscan -H "$GANDI_SSH_HOST" >> ~/.ssh/known_hosts
          # Do not use a heredoc here: YAML indentation would break ssh_config parsing.
          {
            echo "Host gandi"
            echo "  HostName ${GANDI_SSH_HOST}"
            echo "  User ${GANDI_SSH_USER}"
            echo "  IdentityFile ~/.ssh/gandi_deploy"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Push to Gandi Git and deploy
        env:
          GANDI_GIT_REPO: ${{ vars.GANDI_GIT_REPO }}
          GANDI_SSH_HOST: ${{ vars.GANDI_SSH_HOST }}
          GANDI_SSH_USER: ${{ vars.GANDI_SSH_USER }}
        run: |
          DEPLOY_BRANCH="main"
          GANDI_GIT_REPO="${GANDI_GIT_REPO//[$'\t\r\n ']}"
          GIT_REMOTE="git+ssh://${GANDI_SSH_USER}@${GANDI_SSH_HOST}/${GANDI_GIT_REPO}"
          SSH_CMD="ssh -i ~/.ssh/gandi_deploy -o IdentitiesOnly=yes -o BatchMode=yes"

          cd .gandi-deploy
          git init -b "$DEPLOY_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add htdocs
          git commit -m "Deploy ${GITHUB_REF_NAME} (${GITHUB_SHA:0:7})"

          GIT_SSH_COMMAND="$SSH_CMD" git push --force "$GIT_REMOTE" "HEAD:${DEPLOY_BRANCH}"

          $SSH_CMD "${GANDI_SSH_USER}@${GANDI_SSH_HOST}" "deploy ${GANDI_GIT_REPO} ${DEPLOY_BRANCH}"
