name: Deploy to Gandi (static SPA)

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-gandi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GANDI_STATIC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:gandi

      - name: Prepare htdocs for Gandi
        run: bash scripts/prepare-gandi-deploy.sh

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GANDI_SSH_KEY }}" > ~/.ssh/gandi_deploy
          chmod 600 ~/.ssh/gandi_deploy
          ssh-keyscan -H "${{ vars.GANDI_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Push to Gandi Git and deploy
        env:
          GANDI_SSH_USER: ${{ vars.GANDI_SSH_USER }}
          GANDI_SSH_HOST: ${{ vars.GANDI_SSH_HOST }}
          GANDI_GIT_REPO: ${{ vars.GANDI_GIT_REPO }}
        run: |
          DEPLOY_BRANCH="main"
          GIT_REMOTE="git+ssh://${GANDI_SSH_USER}@${GANDI_SSH_HOST}/${GANDI_GIT_REPO}"
          SSH_CMD="ssh -i ~/.ssh/gandi_deploy -o IdentitiesOnly=yes"

          cd .gandi-deploy
          git init -b "$DEPLOY_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add htdocs
          git commit -m "Deploy ${GITHUB_REF_NAME} (${GITHUB_SHA:0:7})"

          GIT_SSH_COMMAND="$SSH_CMD" git push --force "$GIT_REMOTE" "HEAD:${DEPLOY_BRANCH}"

          $SSH_CMD "${GANDI_SSH_USER}@${GANDI_SSH_HOST}" "deploy ${GANDI_GIT_REPO} ${DEPLOY_BRANCH}"
